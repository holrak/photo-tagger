name: Publish to PyPI

on:
  release:
    types: [published]

  push:
    tags:
      - "v*"

  # Allows manual trigger from Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: "pyproject.toml"

      - name: Run tests
        # A tag push or a manually-dispatched release never triggers tests.yml, so without this
        # gate a broken commit could be built and published without a single test running on it.
        run: |
          uv sync --locked --no-build --no-binary-package photo-tagger --group test
          uv run --locked --no-build --no-binary-package photo-tagger pytest

      - name: Build package
        run: uv build

      - name: Store the distribution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    # Real PyPI only after the same artifacts landed on TestPyPI in this run: the staging step
    # is a gate, not a parallel best-effort mirror.
    needs: [build, publish-to-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'release'

    environment:
      name: pypi
      url: https://pypi.org/p/photo-tagger

    permissions:
      id-token: write # Required for OIDC trusted publishing

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs for tag pushes AND for the release event, where it gates publish-to-pypi: a release
    # re-upload of an already-staged version is a no-op thanks to skip-existing below.

    environment:
      name: testpypi
      url: https://test.pypi.org/p/photo-tagger

    permissions:
      id-token: write # Required for OIDC trusted publishing

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true # Do not fail if the version already exists on TestPyPI (tag re-run)
